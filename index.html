<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Dump - Riyan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFDF8;
      --black: #0F0F0F;
      --border-width: 3px;
      
      /* Neo-Brutalism Palette */
      --yellow: #FFD836;
      --green: #4ADE80;
      --pink: #FF66A1;
      --purple: #A78BFA;
      --blue: #60A5FA;
      --orange: #FB923C;
      --grey: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 60px 20px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
    }

    /* Brutalist Core Classes */
    .brutal-box {
      background: #FFFFFF;
      border: var(--border-width) solid var(--black);
      border-radius: 12px;
      box-shadow: 4px 4px 0px var(--black);
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }

    .brutal-btn {
      cursor: pointer;
      user-select: none;
    }

    /* Animasi Klik Profesional (Tidak too much) */
    .brutal-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--black);
    }

    /* Header Section */
    .top-nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .icon-btn {
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      background: #FFFFFF;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 24px;
    }

    /* Input Form Area */
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
    }

    .main-input {
      flex: 1;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
    }

    .main-input::placeholder {
      color: #9CA3AF;
      font-weight: 600;
    }

    .btn-add {
      width: 58px;
      background-color: var(--yellow);
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Title Sections */
    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .idea-card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-icon-wrapper {
      width: 48px;
      height: 48px;
      border: 2px solid var(--black);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }

    .card-task-count {
      position: absolute;
      top: 16px;
      right: 14px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #6B7280;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.3;
      word-break: break-word;
    }

    /* Delete Button on Card */
    .btn-delete-card {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--pink);
      border: 2px solid var(--black);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .idea-card:hover .btn-delete-card {
      opacity: 1;
    }

    /* Detail Page */
    .status-select {
      appearance: none;
      background: var(--bg-color);
      border: 2px solid var(--black);
      padding: 6px 12px 6px 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }

    .btn-back {
      background: #FFFFFF;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    /* Todo List */
    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #FFFFFF;
    }

    .todo-checkbox {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid var(--black);
      border-radius: 6px;
      background: #FFFFFF;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .todo-checkbox:checked {
      background: var(--green);
    }

    .todo-checkbox:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-weight: 800;
      color: var(--black);
    }

    .todo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .todo-text {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .todo-note {
      font-size: 0.8rem;
      color: #6B7280;
      font-weight: 600;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .todo-item.completed {
      background: var(--grey);
      box-shadow: 2px 2px 0px var(--black);
      transform: translate(2px, 2px);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #6B7280;
    }

    .btn-icon-delete {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--black);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .modal-label {
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 8px;
      display: block;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-modal {
      flex: 1;
      padding: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      text-align: center;
    }

    .hidden { display: none !important; }
    
    .footer {
      text-align: center;
      font-weight: 800;
      font-size: 0.9rem;
      margin-top: 40px;
      border-top: 3px solid var(--black);
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- HALAMAN 1: WELCOME & IDEAS GRID -->
    <div id="page-home">
      <!-- Navigasi Atas -->
      <div class="top-nav">
        <div class="brutal-box icon-btn brutal-btn">⚙️</div>
        <div class="brutal-box icon-btn brutal-btn">🔍</div>
      </div>

      <!-- Headline -->
      <h1 class="hero-title">Tangkap ide.<br>Eksekusi nanti.</h1>

      <!-- Input Form -->
      <form class="input-group" onsubmit="addIdea(event)">
        <input type="text" id="idea-title" class="brutal-box main-input" placeholder="# Tulis ide di kepalamu..." required autocomplete="off">
        <button type="submit" class="brutal-box brutal-btn btn-add">+</button>
      </form>

      <!-- Koleksi Ide -->
      <div class="section-title">
        Koleksi Ide Saya
        <span id="total-ideas-count" style="font-size: 0.8rem; background: var(--black); color: white; padding: 2px 8px; border-radius: 20px;">0</span>
      </div>
      
      <div id="ideas-grid" class="grid-container">
        <!-- Grid card akan dirender via JS -->
      </div>
    </div>


    <!-- HALAMAN 2: DETAIL PROYEK & TASK -->
    <div id="page-detail" class="hidden">
      <button class="brutal-box brutal-btn btn-back" onclick="navigateTo('page-home')">
        ← Kembali
      </button>

      <!-- Header Detail -->
      <div class="brutal-box" style="padding: 20px; margin-bottom: 24px;">
        <h2 id="detail-title" style="font-size: 1.6rem; font-weight: 800; margin-bottom: 16px; line-height: 1.2;"></h2>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.85rem; font-weight: 700;">Status:</span>
          <select id="detail-status" class="status-select brutal-btn" onchange="updateIdeaStatus(this.value)">
            <option value="💡 Open">💡 Open</option>
            <option value="🚀 Progress">🚀 Progress</option>
            <option value="✅ Closed">✅ Closed</option>
            <option value="⏸️ Pending">⏸️ Pending</option>
          </select>
        </div>
      </div>

      <!-- Form Tambah Action Plan -->
      <div class="section-title">Langkah Eksekusi Selanjutnya</div>
      <form class="input-group" onsubmit="addTodo(event)">
        <input type="text" id="todo-text" class="brutal-box main-input" placeholder="Tulis action plan..." required autocomplete="off">
        <button type="submit" class="brutal-box brutal-btn btn-add" style="background: var(--purple);">+</button>
      </form>

      <!-- List Task -->
      <div id="todo-list"></div>
    </div>


    <!-- FOOTER -->
    <div class="footer">
      Riyan for 2027
    </div>

  </div>

  <!-- MODAL EDIT TASK -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="brutal-box modal-box">
      <h3 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 20px;">Detail Action Plan</h3>
      
      <div style="margin-bottom: 16px;">
        <label class="modal-label">Aksi / Judul</label>
        <input type="text" id="modal-task-title" class="brutal-box main-input" style="width: 100%; padding: 12px;">
      </div>
      
      <div>
        <label class="modal-label">Catatan Tambahan</label>
        <textarea id="modal-task-note" class="brutal-box main-input" style="width: 100%; min-height: 100px; padding: 12px; resize: vertical;" placeholder="Rincian spesifik, link, dll..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="brutal-box brutal-btn btn-modal" style="background: var(--grey);" onclick="closeTaskModal()">Batal</button>
        <button class="brutal-box brutal-btn btn-modal" style="background: var(--green);" onclick="saveTaskModal()">Simpan</button>
      </div>
    </div>
  </div>


  <script>
    // Palet warna & icon untuk Neo-Brutalism randomizer
    const palette = ['#FFD836', '#4ADE80', '#FF66A1', '#A78BFA', '#60A5FA', '#FB923C'];
    const icons = ['💡', '📂', '⚡', '🎯', '🚀', '🛠️', '🎨'];

    let ideas = JSON.parse(localStorage.getItem('riyan_brutalist_ideas')) || [];
    let currentIdeaId = null;
    let currentEditingTodoId = null;

    // Inisialisasi awal
    renderIdeas();

    function saveToStorage() {
      localStorage.setItem('riyan_brutalist_ideas', JSON.stringify(ideas));
    }

    function navigateTo(pageId) {
      document.getElementById('page-home').classList.add('hidden');
      document.getElementById('page-detail').classList.add('hidden');
      document.getElementById(pageId).classList.remove('hidden');

      if (pageId === 'page-home') renderIdeas();
    }

    function addIdea(e) {
      e.preventDefault();
      const titleInput = document.getElementById('idea-title');
      
      const randomColor = palette[Math.floor(Math.random() * palette.length)];
      const randomIcon = icons[Math.floor(Math.random() * icons.length)];

      const newIdea = {
        id: Date.now(),
        title: titleInput.value,
        status: '💡 Open',
        color: randomColor,
        icon: randomIcon,
        todos: []
      };
      
      ideas.unshift(newIdea); // Masukkan ke atas
      saveToStorage();
      titleInput.value = '';
      renderIdeas();
    }

    function renderIdeas() {
      const container = document.getElementById('ideas-grid');
      container.innerHTML = '';
      document.getElementById('total-ideas-count').innerText = ideas.length;

      if (ideas.length === 0) {
        container.style.display = 'block';
        container.innerHTML = `
          <div class="brutal-box" style="padding: 30px; text-align: center; border-style: dashed; background: transparent; box-shadow: none;">
            <p style="font-weight: 700; color: #6B7280;">Kosong! Cepat tuangkan ide pertamamu di atas.</p>
          </div>
        `;
        return;
      }

      container.style.display = 'grid';

      ideas.forEach(idea => {
        const div = document.createElement('div');
        div.className = 'brutal-box brutal-btn idea-card';
        div.onclick = (e) => {
          // Jangan buka detail kalau yang diklik adalah tombol hapus
          if(!e.target.classList.contains('btn-delete-card')) {
             openDetail(idea.id);
          }
        };

        const taskCount = idea.todos ? idea.todos.length : 0;

        div.innerHTML = `
          <div class="card-icon-wrapper" style="background: ${idea.color};">
            ${idea.icon}
          </div>
          <div class="card-task-count">${taskCount} task</div>
          <div class="card-title">${escapeHtml(idea.title)}</div>
          <button class="btn-delete-card" onclick="deleteIdea(event, ${idea.id})" title="Hapus Ide">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function openDetail(id) {
      currentIdeaId = id;
      const idea = ideas.find(item => item.id === id);
      if (!idea) return;

      document.getElementById('detail-title').innerText = idea.title;
      document.getElementById('detail-status').value = idea.status;

      renderTodos();
      navigateTo('page-detail');
    }

    function updateIdeaStatus(newStatus) {
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea) {
        idea.status = newStatus;
        saveToStorage();
      }
    }

    function deleteIdea(e, id) {
      e.stopPropagation();
      if(confirm('Yakin membuang ide ini dari kepalamu?')) {
        ideas = ideas.filter(item => item.id !== id);
        saveToStorage();
        renderIdeas();
      }
    }

    function addTodo(e) {
      e.preventDefault();
      const todoInput = document.getElementById('todo-text');
      const idea = ideas.find(item => item.id === currentIdeaId);

      if (idea) {
        idea.todos.push({
          id: Date.now(),
          text: todoInput.value,
          note: '',
          completed: false
        });
        saveToStorage();
        todoInput.value = '';
        renderTodos();
      }
    }

    function toggleTodo(e, todoId) {
      e.stopPropagation();
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea) {
        const todo = idea.todos.find(t => t.id === todoId);
        if (todo) {
          todo.completed = !todo.completed;
          saveToStorage();
          renderTodos();
        }
      }
    }

    function deleteTodo(e, todoId) {
      e.stopPropagation();
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea) {
        idea.todos = idea.todos.filter(t => t.id !== todoId);
        saveToStorage();
        renderTodos();
      }
    }

    function renderTodos() {
      const container = document.getElementById('todo-list');
      container.innerHTML = '';
      const idea = ideas.find(item => item.id === currentIdeaId);

      if (!idea || idea.todos.length === 0) {
        container.innerHTML = `
          <div class="brutal-box" style="padding: 20px; text-align: center; border-style: dashed; background: transparent; box-shadow: none;">
            <p style="font-weight: 700; color: #6B7280;">Belum ada langkah eksekusi.</p>
          </div>
        `;
        return;
      }

      idea.todos.forEach(todo => {
        const div = document.createElement('div');
        div.className = `brutal-box brutal-btn todo-item ${todo.completed ? 'completed' : ''}`;
        div.onclick = () => openTaskModal(todo.id);

        div.innerHTML = `
          <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(event, ${todo.id})">
          <div class="todo-content">
            <span class="todo-text">${escapeHtml(todo.text)}</span>
            ${todo.note ? `<span class="todo-note">📝 ${escapeHtml(todo.note)}</span>` : '<span class="todo-note" style="opacity:0.5;">+ Tambah catatan</span>'}
          </div>
          <button class="btn-icon-delete brutal-btn" onclick="deleteTodo(event, ${todo.id})">🗑️</button>
        `;
        container.appendChild(div);
      });
    }

    /* Logic Modal Edit Task */
    function openTaskModal(todoId) {
      currentEditingTodoId = todoId;
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (!idea) return;
      const todo = idea.todos.find(t => t.id === todoId);
      if (!todo) return;

      document.getElementById('modal-task-title').value = todo.text;
      document.getElementById('modal-task-note').value = todo.note || '';
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
      currentEditingTodoId = null;
    }

    function saveTaskModal() {
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea && currentEditingTodoId) {
        const todo = idea.todos.find(t => t.id === currentEditingTodoId);
        if (todo) {
          todo.text = document.getElementById('modal-task-title').value || todo.text;
          todo.note = document.getElementById('modal-task-note').value;
          saveToStorage();
          renderTodos();
        }
      }
      closeTaskModal();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>

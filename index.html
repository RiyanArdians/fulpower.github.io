<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Dump - Riyan</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #FFFDF8;
      --black: #0F0F0F;
      --border-width: 3px;
      
      /* Neo-Brutalism Palette */
      --yellow: #FFD836;
      --green: #4ADE80;
      --pink: #FF66A1;
      --purple: #A78BFA;
      --blue: #60A5FA;
      --orange: #FB923C;
      --grey: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      width: 100%;
      max-width: none; /* Full width menyesuaikan device sesuai request */
      padding: 20px;
      flex: 1; /* Membuat container mengambil sisa tinggi untuk mendorong footer */
    }

    /* Brutalist Core Classes */
    .brutal-box {
      background: #FFFFFF;
      border: var(--border-width) solid var(--black);
      border-radius: 12px;
      box-shadow: 4px 4px 0px var(--black);
      transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
    }

    .brutal-btn {
      cursor: pointer;
      user-select: none;
    }

    /* Animasi Klik Presisi (Tidak too much) */
    .brutal-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px var(--black);
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 3.5rem); /* Ukuran teks responsif */
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 24px;
      margin-top: 10px;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      width: 100%;
    }

    .main-input {
      flex: 1;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
    }

    .main-input::placeholder {
      color: #9CA3AF;
      font-weight: 600;
    }

    .btn-add {
      width: 64px;
      background-color: var(--yellow);
      font-size: 2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Section Title */
    .section-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-container {
      display: grid;
      /* Grid otomatis mengisi ruang layar: HP 2 kolom, Desktop bisa 4-6 kolom */
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .idea-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      height: 100%;
      min-height: 160px;
    }

    .card-icon-wrapper {
      width: 54px;
      height: 54px;
      border: 2px solid var(--black);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: auto; /* Mendorong title ke bawah */
      cursor: pointer;
      background-color: #fff;
    }

    /* Animasi kecil saat icon dihover untuk interaksi */
    .card-icon-wrapper:hover {
      transform: scale(1.05);
    }

    .card-task-count {
      position: absolute;
      top: 16px;
      right: 14px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #4B5563;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.3;
      word-break: break-word;
      margin-top: 20px;
    }

    .btn-delete-card {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: var(--pink);
      border: 2px solid var(--black);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* Munculkan tombol delete saat hover atau aktif (untuk mobile) */
    .idea-card:hover .btn-delete-card,
    .idea-card:active .btn-delete-card {
      opacity: 1;
    }

    /* Detail Page */
    .status-select {
      appearance: none;
      background: var(--bg-color);
      border: 2px solid var(--black);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    .btn-back {
      background: #FFFFFF;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      margin-bottom: 14px;
      background: #FFFFFF;
    }

    .todo-checkbox {
      appearance: none;
      width: 26px;
      height: 26px;
      border: 2px solid var(--black);
      border-radius: 6px;
      background: #FFFFFF;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .todo-checkbox:checked {
      background: var(--green);
    }

    .todo-checkbox:checked::after {
      content: '✔';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: 800;
      color: var(--black);
    }

    .todo-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .todo-text {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.4;
    }

    .todo-note {
      font-size: 0.85rem;
      color: #4B5563;
      font-weight: 700;
      margin-top: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .todo-item.completed {
      background: var(--grey);
      box-shadow: 2px 2px 0px var(--black);
      transform: translate(2px, 2px);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #6B7280;
    }

    .btn-icon-delete {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--black);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-label {
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 8px;
      display: block;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-modal {
      flex: 1;
      padding: 16px;
      font-weight: 800;
      font-size: 0.95rem;
      text-align: center;
    }

    /* Emoji Picker Grid */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .emoji-btn {
      font-size: 1.8rem;
      padding: 8px;
      background: var(--grey);
      border: 2px solid var(--black);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .emoji-btn:hover, .emoji-btn:active {
      background: var(--yellow);
    }

    .hidden { display: none !important; }
    
    .footer {
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      padding: 24px 20px;
      border-top: 3px solid var(--black);
      background-color: var(--bg-color);
      margin-top: auto; /* Mendorong footer agar mentok ke bawah layar */
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div id="page-home">
      <!-- Headline Semangat & Profesional -->
      <h1 class="hero-title">Rancang Masa Depan.<br>Mulai dari Ide Pertama.</h1>

      <!-- Input Form -->
      <form class="input-group" onsubmit="addIdea(event)">
        <input type="text" id="idea-title" class="brutal-box main-input" placeholder="# Tulis ide di kepalamu..." required autocomplete="off">
        <button type="submit" class="brutal-box brutal-btn btn-add">+</button>
      </form>

      <!-- Koleksi Ide -->
      <div class="section-title">
        Koleksi Ide Saya
        <span id="total-ideas-count" style="font-size: 0.9rem; background: var(--black); color: white; padding: 4px 10px; border-radius: 20px;">0</span>
      </div>
      
      <div id="ideas-grid" class="grid-container">
        <!-- Grid card dirender via JS -->
      </div>
    </div>


    <div id="page-detail" class="hidden">
      <button class="brutal-box brutal-btn btn-back" onclick="navigateTo('page-home')">
        ← Kembali
      </button>

      <!-- Header Detail -->
      <div class="brutal-box" style="padding: 24px; margin-bottom: 30px;">
        <h2 id="detail-title" style="font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; margin-bottom: 16px; line-height: 1.2;"></h2>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <span style="font-size: 0.95rem; font-weight: 800;">Status Proyek:</span>
          <select id="detail-status" class="status-select brutal-btn" onchange="updateIdeaStatus(this.value)">
            <option value="💡 Open">💡 Open</option>
            <option value="🚀 Progress">🚀 Progress</option>
            <option value="✅ Closed">✅ Closed</option>
            <option value="⏸️ Pending">⏸️ Pending</option>
          </select>
        </div>
      </div>

      <!-- Form Tambah Action Plan -->
      <div class="section-title">Langkah Eksekusi Selanjutnya</div>
      <form class="input-group" onsubmit="addTodo(event)">
        <input type="text" id="todo-text" class="brutal-box main-input" placeholder="Tulis rincian action plan..." required autocomplete="off">
        <button type="submit" class="brutal-box brutal-btn btn-add" style="background: var(--purple);">+</button>
      </form>

      <!-- List Task -->
      <div id="todo-list"></div>
    </div>

  </div>

  <!-- Footer Mentok Bawah -->
  <div class="footer">
    Riyan for 2027
  </div>

  
  <!-- Modal Edit Task -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="brutal-box modal-box">
      <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 24px;">Detail Action Plan</h3>
      
      <div style="margin-bottom: 20px;">
        <label class="modal-label">Aksi / Judul</label>
        <input type="text" id="modal-task-title" class="brutal-box main-input" style="width: 100%; padding: 14px;">
      </div>
      
      <div>
        <label class="modal-label">Catatan Tambahan</label>
        <textarea id="modal-task-note" class="brutal-box main-input" style="width: 100%; min-height: 120px; padding: 14px; resize: vertical;" placeholder="Rincian, panduan, atau target waktu..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="brutal-box brutal-btn btn-modal" style="background: var(--grey);" onclick="closeTaskModal()">Batal</button>
        <button class="brutal-box brutal-btn btn-modal" style="background: var(--green);" onclick="saveTaskModal()">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Pilih Icon (Emoji Picker) -->
  <div id="icon-modal" class="modal-overlay hidden">
    <div class="brutal-box modal-box">
      <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">Pilih Ikon Baru</h3>
      <p style="font-size: 0.9rem; font-weight: 700; color: #4B5563; margin-bottom: 16px;">Sesuaikan ikon agar lebih representatif dengan ide.</p>
      
      <div id="emoji-picker-container" class="emoji-grid">
        <!-- Emojis dirender via JS -->
      </div>

      <div class="modal-footer">
        <button class="brutal-box brutal-btn btn-modal" style="background: var(--grey);" onclick="closeIconModal()">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    // Palet warna untuk background ikon agar bervariasi
    const palette = ['#FFD836', '#4ADE80', '#FF66A1', '#A78BFA', '#60A5FA', '#FB923C'];
    
    // Daftar emoji lengkap (profesional & fun)
    const availableEmojis = [
      '💡','🚀','🎯','🛠️','🎨','🔥','⚡','📈','💸','🌍',
      '🏆','🧩','✨','💻','📱','📸','🍔','☕','✈️','🎵',
      '📚','🧠','💪','🌿','🏢','📝','⚙️','🛡️','💎','🎤'
    ];

    let ideas = JSON.parse(localStorage.getItem('riyan_workspace_v3')) || [];
    let currentIdeaId = null;
    let currentEditingTodoId = null;
    let targetIdeaForIcon = null; // Menyimpan ID ide yang ikonnya sedang mau diganti

    // Inisialisasi awal
    renderIdeas();
    renderEmojiPicker();

    function saveToStorage() {
      localStorage.setItem('riyan_workspace_v3', JSON.stringify(ideas));
    }

    // Fungsi Navigasi Halaman
    function navigateTo(pageId) {
      document.getElementById('page-home').classList.add('hidden');
      document.getElementById('page-detail').classList.add('hidden');
      document.getElementById(pageId).classList.remove('hidden');

      if (pageId === 'page-home') renderIdeas();
    }

    function addIdea(e) {
      e.preventDefault();
      const titleInput = document.getElementById('idea-title');
      
      const randomColor = palette[Math.floor(Math.random() * palette.length)];
      
      // Default icon adalah bohlam, nanti bisa diubah user
      const newIdea = {
        id: Date.now(),
        title: titleInput.value,
        status: '💡 Open',
        color: randomColor,
        icon: '💡',
        todos: []
      };
      
      ideas.unshift(newIdea); // Masukkan ke urutan paling atas
      saveToStorage();
      titleInput.value = '';
      renderIdeas();
    }

    function renderIdeas() {
      const container = document.getElementById('ideas-grid');
      container.innerHTML = '';
      document.getElementById('total-ideas-count').innerText = ideas.length;

      if (ideas.length === 0) {
        container.style.display = 'block';
        container.innerHTML = `
          <div class="brutal-box" style="padding: 40px 20px; text-align: center; border-style: dashed; background: transparent; box-shadow: none;">
            <p style="font-weight: 800; font-size: 1.1rem; color: #4B5563;">Belum ada ide. Ayo mulai rancang masa depanmu!</p>
          </div>
        `;
        return;
      }

      container.style.display = 'grid';

      ideas.forEach(idea => {
        const div = document.createElement('div');
        div.className = 'brutal-box brutal-btn idea-card';
        // Mencegah navigasi ke halaman detail bila yang diklik adalah tombol/icon tertentu
        div.onclick = (e) => {
          if(!e.target.closest('.btn-delete-card') && !e.target.closest('.card-icon-wrapper')) {
             openDetail(idea.id);
          }
        };

        const taskCount = idea.todos ? idea.todos.length : 0;

        div.innerHTML = `
          <div class="card-icon-wrapper brutal-btn" style="background: ${idea.color};" onclick="openIconPicker(event, ${idea.id})" title="Ganti Ikon">
            ${idea.icon || '💡'}
          </div>
          <div class="card-task-count">${taskCount} task</div>
          <div class="card-title">${escapeHtml(idea.title)}</div>
          <button class="btn-delete-card brutal-btn" onclick="deleteIdea(event, ${idea.id})" title="Hapus Ide">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function renderEmojiPicker() {
      const container = document.getElementById('emoji-picker-container');
      container.innerHTML = '';
      
      availableEmojis.forEach(emoji => {
        const btn = document.createElement('div');
        btn.className = 'emoji-btn';
        btn.innerText = emoji;
        btn.onclick = () => saveNewIcon(emoji);
        container.appendChild(btn);
      });
    }

    function openIconPicker(e, id) {
      e.stopPropagation(); // Mencegah pindah ke halaman detail
      targetIdeaForIcon = id;
      document.getElementById('icon-modal').classList.remove('hidden');
    }

    function closeIconModal() {
      document.getElementById('icon-modal').classList.add('hidden');
      targetIdeaForIcon = null;
    }

    function saveNewIcon(selectedEmoji) {
      if (targetIdeaForIcon) {
        const idea = ideas.find(item => item.id === targetIdeaForIcon);
        if (idea) {
          idea.icon = selectedEmoji;
          saveToStorage();
          renderIdeas(); // Refresh grid
        }
      }
      closeIconModal();
    }


    function openDetail(id) {
      currentIdeaId = id;
      const idea = ideas.find(item => item.id === id);
      if (!idea) return;

      document.getElementById('detail-title').innerText = idea.title;
      document.getElementById('detail-status').value = idea.status;

      renderTodos();
      navigateTo('page-detail');
    }

    function updateIdeaStatus(newStatus) {
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea) {
        idea.status = newStatus;
        saveToStorage();
      }
    }

    function deleteIdea(e, id) {
      e.stopPropagation();
      if(confirm('Yakin ingin menghapus ide ini?')) {
        ideas = ideas.filter(item => item.id !== id);
        saveToStorage();
        renderIdeas();
      }
    }

    function addTodo(e) {
      e.preventDefault();
      const todoInput = document.getElementById('todo-text');
      const idea = ideas.find(item => item.id === currentIdeaId);

      if (idea) {
        idea.todos.push({
          id: Date.now(),
          text: todoInput.value,
          note: '',
          completed: false
        });
        saveToStorage();
        todoInput.value = '';
        renderTodos();
      }
    }

    function toggleTodo(e, todoId) {
      e.stopPropagation();
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea) {
        const todo = idea.todos.find(t => t.id === todoId);
        if (todo) {
          todo.completed = !todo.completed;
          saveToStorage();
          renderTodos();
        }
      }
    }

    function deleteTodo(e, todoId) {
      e.stopPropagation();
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea) {
        idea.todos = idea.todos.filter(t => t.id !== todoId);
        saveToStorage();
        renderTodos();
      }
    }

    function renderTodos() {
      const container = document.getElementById('todo-list');
      container.innerHTML = '';
      const idea = ideas.find(item => item.id === currentIdeaId);

      if (!idea || idea.todos.length === 0) {
        container.innerHTML = `
          <div class="brutal-box" style="padding: 24px; text-align: center; border-style: dashed; background: transparent; box-shadow: none;">
            <p style="font-weight: 800; color: #4B5563;">Belum ada langkah eksekusi.</p>
          </div>
        `;
        return;
      }

      idea.todos.forEach(todo => {
        const div = document.createElement('div');
        div.className = `brutal-box brutal-btn todo-item ${todo.completed ? 'completed' : ''}`;
        
        // Membuka modal edit task bila yang diklik bukan checkbox / tong sampah
        div.onclick = (e) => {
          if(!e.target.closest('.todo-checkbox') && !e.target.closest('.btn-icon-delete')) {
            openTaskModal(todo.id);
          }
        };

        div.innerHTML = `
          <input type="checkbox" class="todo-checkbox brutal-btn" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(event, ${todo.id})">
          <div class="todo-content">
            <span class="todo-text">${escapeHtml(todo.text)}</span>
            ${todo.note ? `<span class="todo-note">📝 ${escapeHtml(todo.note)}</span>` : '<span class="todo-note" style="opacity:0.6;">+ Klik untuk tambah catatan</span>'}
          </div>
          <button class="btn-icon-delete brutal-btn" onclick="deleteTodo(event, ${todo.id})" title="Hapus Task">🗑️</button>
        `;
        container.appendChild(div);
      });
    }

    function openTaskModal(todoId) {
      currentEditingTodoId = todoId;
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (!idea) return;
      const todo = idea.todos.find(t => t.id === todoId);
      if (!todo) return;

      document.getElementById('modal-task-title').value = todo.text;
      document.getElementById('modal-task-note').value = todo.note || '';
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('task-modal').classList.add('hidden');
      currentEditingTodoId = null;
    }

    function saveTaskModal() {
      const idea = ideas.find(item => item.id === currentIdeaId);
      if (idea && currentEditingTodoId) {
        const todo = idea.todos.find(t => t.id === currentEditingTodoId);
        if (todo) {
          todo.text = document.getElementById('modal-task-title').value || todo.text;
          todo.note = document.getElementById('modal-task-note').value;
          saveToStorage();
          renderTodos();
        }
      }
      closeTaskModal();
    }

    // Helpers
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
